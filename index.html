<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقاتي الرسمية | متجري الشخصي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-4xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">تطبيقاتي المميزة</h1>
            <p class="text-gray-600">مرحباً بك في الصفحة الرسمية لتطبيقاتي، يمكنك تحميلها مباشرة.</p>
        </header>
        
        <div class="grid md:grid-cols-2 gap-6">
            <!-- بطاقة التطبيق الأول -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h3 class="text-xl font-bold mb-2">اسم تطبيقك الأول</h3>
                <p class="text-gray-600 text-sm mb-4">وصف قصير يوضح ميزات تطبيقك الأول وما يقدمه للمستخدمين.</p>
                <a href="رابط_متجر_التطبيقات_هنا" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">تحميل التطبيق</a>
            </div>

            <!-- بطاقة التطبيق الثاني -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h3 class="text-xl font-bold mb-2">اسم تطبيقك الثاني</h3>
                <p class="text-gray-600 text-sm mb-4">وصف قصير يوضح ميزات تطبيقك الثاني وكيف يفيد المستخدم.</p>
                <a href="رابط_متجر_التطبيقات_هنا" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">تحميل التطبيق</a>
            </div>
        </div>
        
        <footer class="text-center mt-16 text-gray-400 text-sm">
            <p>جميع الحقوق محفوظة © 2026</p>
        </footer>
    </div>
</body>
</html>
